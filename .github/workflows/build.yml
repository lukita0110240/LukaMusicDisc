name: Build LukaMusicDisc

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Get Titanes audio
        run: |
          mkdir -p src/main/resources/assets/lukamusicdisc/sounds
          curl --fail --location --retry 3 \
            'https://mp3tourl.com/audio/1793996789362-3029d8b3-375b-4b93-bfc5-496029a772e5.ogg' \
            --output src/main/resources/assets/lukamusicdisc/sounds/titanes.ogg
          test -s src/main/resources/assets/lukamusicdisc/sounds/titanes.ogg
      - name: Build mod
        run: gradle --no-daemon build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: LukaMusicDisc-Minecraft-26.1.2-Forge
          path: build/libs/*.jar
          if-no-files-found: error
